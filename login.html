<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Área de Membros</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08081a;font-family:'Inter',sans-serif;color:#fff;display:flex;justify-content:center;min-height:100vh}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at top, #2a1a5e 0%, #08081a 60%);z-index:0}
.container{width:100%;max-width:480px;position:relative;z-index:2;padding:16px}
.login-box{background:#000;border:2px solid #a855f7;border-radius:16px;padding:24px;text-align:center;margin-top:40px}
.login-box h2{font-family:'Anton';color:#ffea00;font-size:32px}
.login-box p{margin-top:8px;font-weight:700;color:#c084fc}
.login-box input{width:100%;padding:16px;border-radius:10px;border:1px solid #a855f7;background:#111;color:#fff;margin-top:14px;text-align:center;font-size:16px}
.btn{width:100%;margin-top:14px;background:#ffea00;color:#000;font-family:'Anton';font-size:20px;padding:16px;border-radius:12px;border:none;cursor:pointer}
#msg{margin-top:12px;font-size:13px;color:#f87171;font-weight:700}
</style>
</head>
<body>
<div class="container">
  <div class="login-box">
    <h2>ÁREA DE MEMBROS</h2>
    <p>Digite seu e-mail e senha da compra</p>
    <input type="email" id="email" placeholder="seu e-mail da Kiwify">
    <input type="password" id="senha" placeholder="senha recebida">
    <button class="btn" onclick="entrar()">ENTRAR</button>
    <p id="msg"></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supa = supabase.createClient('https://baxhthbmvjnojzagjcjc.supabase.co', 'sb_publishable_PODkx7P_zOC43o6oGN2agg_8SUyMDUT');
  async function entrar(){
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('senha').value.trim();
    const { error } = await supa.auth.signInWithPassword({email, password});
    if(error){ document.getElementById('msg').innerText = 'E-mail ou senha errados'; }
    else { window.location.href = '/membros.html'; }
  }
</script>
</body>
</html>
