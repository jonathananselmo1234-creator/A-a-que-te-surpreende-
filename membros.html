<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área de Membros - Açaí</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08081a;font-family:Inter,sans-serif;color:#fff;display:flex;justify-content:center}
.container{width:100%;max-width:480px;padding:20px;z-index:2}
.box{background:#000;border:1px solid #a855f7;border-radius:14px;padding:20px;text-align:center}
input{width:100%;padding:16px;border-radius:10px;border:none;margin-top:12px;text-align:center;font-size:18px}
.btn-acesso{width:100%;margin-top:12px;background:#ffea00;color:#000;font-family:Anton,sans-serif;font-size:20px;padding:16px;border-radius:12px;border:none;cursor:pointer}
.video-wrap{display:none;margin-top:20px}
.video-wrap h3{color:#c084fc;font-family:Anton;margin:20px 0 10px;text-align:left}
video{width:100%;border-radius:12px;border:2px solid #a855f7}
</style>
</head>
<body>
<div class="container">
  <div class="box">
    <h2 style="font-family:Anton;color:#ffea00">ÁREA DE MEMBROS</h2>
    <p style="margin-top:8px;font-weight:700">Digite a senha ACAI87</p>
    <input type="password" id="senha" placeholder="ACAI87">
    <button class="btn-acesso" onclick="entrar()">LIBERAR ACESSO</button>
  </div>

  <div id="conteudo" class="video-wrap">
    <h3>Módulo 1 - Base Cremosa (Base do seu lucro)</h3>
    <video src="video3.mp4" controls></video>

    <h3>Módulo 2 - Creme de Cupuaçu</h3>
    <video src="cupuacu.mp4" controls></video>

    <h3>Módulo 3 - Copo da Felicidade + 7 Receitas</h3>
    <video src="copo.mp4" controls></video>
  </div>
</div>

<script>
function entrar(){
  if(document.getElementById('senha').value == "ACAI87"){
    document.getElementById('conteudo').style.display="block";
    window.scrollTo(0,300);
  } else { alert("Senha errada! É ACAI87"); }
}
</script>
</body>
</html>
